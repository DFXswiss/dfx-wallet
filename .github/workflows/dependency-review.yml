name: Dependency Review

# Blocks PRs that introduce dependencies with known vulnerabilities.
# Complements the (blocking) npm-audit job in ci.yml: audit checks the whole
# tree on its schedule, this gates the PR diff itself — a new package with a
# known high-severity advisory cannot enter the repo.

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
