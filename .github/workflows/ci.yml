name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # `postinstall` builds @tetherto/wdk-react-native-core's dist/, which
      # ships only `src/` on npm. Typecheck reads its `dist/index.d.ts`.
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # `postinstall` builds @tetherto/wdk-react-native-core's dist/, which
      # ESLint's `import/no-unresolved` resolver depends on.
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm run format

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npx patch-package
      - run: npm test -- --coverage
      - name: Upload coverage summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error

  # Separate job on purpose: a required status check must be its own check
  # context, otherwise it cannot independently block the merge. Fail-closed —
  # a missing coverage artifact is an error, never a pass.
  coverage-floor:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-summary
          path: coverage
      - run: node scripts/check-coverage-floor.mjs
      # Per-file Tier-A floors: the aggregate floor above can't catch a single
      # security-critical file rotting to zero. This pins each one individually.
      - run: node scripts/check-coverage-file-floors.mjs

  # Lowering the coverage floor needs an explicit, visible decision: the
  # `coverage:lower-floor` label. Without it, a quiet floor-file edit inside a
  # big diff fails here.
  coverage-floor-label:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Floors (aggregate + per-file) may only decrease with the coverage:lower-floor label
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'coverage:lower-floor') }}
        run: |
          # Compare against the merge-base, not the base-branch tip: a floor the
          # base raised after this PR forked must not look like a decrease here.
          MERGE_BASE=$(git merge-base "$BASE_SHA" HEAD)
          echo "merge-base: $MERGE_BASE"
          mkdir -p .floor-base
          git show "$MERGE_BASE:.coverage-floor-lines" > .floor-base/lines 2>/dev/null || echo 0 > .floor-base/lines
          git show "$MERGE_BASE:.coverage-floors.json" > .floor-base/floors.json 2>/dev/null || echo '{"files":{}}' > .floor-base/floors.json
          node scripts/check-floor-not-lowered.mjs

  # The README feature matrix is the source of truth for what the wallet does.
  # This job makes matrix drift a merge blocker: referenced files must exist,
  # flags must match src/config/features.ts, and every screen needs a row.
  matrix-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Dependency-free script — no npm install needed.
      - run: node scripts/check-feature-matrix.mjs

  # Visual-baseline coverage: every screen under app/ must be classified in
  # e2e/visual-coverage.json (baselined / exempt-with-reason / pending). A new
  # screen that nobody snapshots cannot ship unaccounted — the structural
  # sibling of the coverage floors, for appearance instead of logic.
  visual-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Dependency-free script — no npm install needed.
      - run: node scripts/check-visual-coverage.mjs
      # The gate validates its own logic against synthetic fixtures so a
      # refactor of the checker can't quietly stop catching regressions.
      - run: node scripts/check-visual-coverage.mjs --self-test

  # Lockfile hygiene: every resolved package must come from registry.npmjs.org
  # over https with an integrity hash. Blocks lockfile-poisoning PRs that
  # repoint a dependency at a hostile mirror or git URL.
  lockfile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: >
          npx --yes lockfile-lint@4.14.1
          --path package-lock.json
          --type npm
          --allowed-hosts npm
          --validate-https
          --validate-integrity

  # PR hygiene: conventional title (greppable history, clean release notes)
  # and a size cap (big PRs get worse reviews; split or label size:override).
  pr-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITLE" | grep -qE '^(feat|fix|docs|chore|refactor|test|ci|build|perf|style|revert)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo "::error::PR title '$TITLE' does not follow conventional-commit format, e.g. 'feat(send): validate EIP-681 amounts'"
            exit 1
          fi
      - name: Size cap (1000 changed lines, label size:override to bypass)
        env:
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
          HAS_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'size:override') }}
        run: |
          TOTAL=$((ADDITIONS + DELETIONS))
          echo "changed lines: $TOTAL"
          if [ "$TOTAL" -gt 1000 ] && [ "$HAS_OVERRIDE" != "true" ]; then
            echo "::error::PR changes $TOTAL lines (cap 1000). Split it, or add the 'size:override' label with a justification in the description (e.g. generated code, lockfile)."
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # Blocking since the test-gates overhaul — a known-high vuln in the
      # dependency tree of a wallet is a merge blocker, not a yellow badge.
      - name: npm audit (high+)
        run: npm audit --audit-level=high

  bundle:
    name: Bundle (${{ matrix.variant }})
    # Builds the JS bundle that `expo run:ios` / `eas build` would ship,
    # catching regressions that pure typecheck/lint cannot — most importantly
    # missing assets, broken `require()` paths in deferred-feature wrappers,
    # and feature-flag combinations that fail to resolve at module-load time.
    # `mvp` builds with every `EXPO_PUBLIC_ENABLE_*` unset (the MVP scope);
    # `full` flips every flag on so a deferred path that drifts out of sync
    # with the rest of the codebase is also caught.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [mvp, full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # `postinstall` builds @tetherto/wdk-react-native-core's dist/ and the
      # `.wdk/` worklet bundle that the app imports unconditionally.
      - run: npm ci --legacy-peer-deps
      - name: Enable all feature flags (full build only)
        if: matrix.variant == 'full'
        run: |
          for flag in RESTORE PASSKEY LEGAL PIN BIOMETRIC PORTFOLIO BUY_SELL LINKED_WALLETS TX_HISTORY PAY DFX_BACKEND TAX_REPORT SETTINGS HARDWARE_WALLET MULTISIG DEEPLINKS WEBVIEW; do
            echo "EXPO_PUBLIC_ENABLE_$flag=true" >> "$GITHUB_ENV"
          done
      - name: Export iOS JS bundle
        run: npx expo export --platform ios --no-bytecode --output-dir dist
      - name: Verify bundle was produced
        run: |
          BUNDLE=$(find dist/_expo/static/js/ios -name '*.js' | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "::error::No JS bundle produced under dist/_expo/static/js/ios/"
            ls -laR dist
            exit 1
          fi
          SIZE=$(stat -c%s "$BUNDLE" 2>/dev/null || stat -f%z "$BUNDLE")
          echo "Bundle: $BUNDLE ($SIZE bytes, variant=${{ matrix.variant }})"
          # Empty or near-empty bundle would silently break the app at boot.
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::Bundle suspiciously small ($SIZE bytes)"
            exit 1
          fi
