name: Reclaim Actions storage

on:
  workflow_dispatch:
  schedule:
    - cron: "27 4 * * *"
  push:
    branches: [develop]
    paths:
      - ".github/workflows/reclaim-artifact-storage.yml"

permissions:
  actions: write
jobs:
  reclaim:
    name: Delete stored Actions artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Delete Actions artifacts older than 24 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deleted=0
          cutoff_epoch=$(($(date -u +%s) - 86400))
          while :; do
            old_ids=""
            page=1
            while :; do
              json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&page=${page}")
              page_len=$(printf '%s' "$json" | jq '.artifacts | length')
              if [ "$page_len" -eq 0 ]; then
                break
              fi
              page_ids=$(printf '%s' "$json" | jq -r --argjson cutoff "$cutoff_epoch" '
                .artifacts[]
                | select(.expired == false)
                | select((.created_at | fromdateiso8601) < $cutoff)
                | .id
              ')
              [ -n "$page_ids" ] && old_ids="${old_ids:+${old_ids}$'\n'}${page_ids}"
              page=$((page + 1))
            done
            if [ -z "$old_ids" ]; then
              echo "Deleted ${deleted} artifacts older than 24 hours."
              break
            fi
            count=0
            while read -r id; do
              [ -z "$id" ] && continue
              if ! err=$(gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" --silent 2>&1); then
                printf '%s' "$err" | grep -qiE '404|Not Found' && continue
                printf '%s\n' "$err" >&2
                exit 1
              fi
              count=$((count + 1))
            done <<< "$old_ids"
            if [ "$count" -eq 0 ]; then
              echo "Deleted ${deleted} artifacts older than 24 hours."
              break
            fi
            deleted=$((deleted + count))
          done
