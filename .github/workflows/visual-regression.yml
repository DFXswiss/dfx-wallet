name: Visual Regression

on:
  workflow_dispatch:
  schedule:
    # Nightly drift check on develop. 03:00 UTC = low-traffic window.
    - cron: '0 3 * * *'
  pull_request:
    branches: [develop]
    # `synchronize` removed on purpose — iterative pushes don't run visual
    # regression. Re-trigger via `ready_for_review` or the `needs-visual` label.
    types: [opened, reopened, ready_for_review, labeled]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

concurrency:
  group: visual-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  EXPO_PUBLIC_WDK_INDEXER_API_KEY: ${{ secrets.E2E_WDK_INDEXER_API_KEY }}

jobs:
  ios:
    name: iOS Visual Regression (${{ matrix.variant }})
    # On `labeled` we only run when the trigger label is `needs-visual`,
    # otherwise every label change (size/area/etc.) would burn a macOS run.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft != true &&
       (github.event.action != 'labeled' || github.event.label.name == 'needs-visual'))
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # `mvp` builds with every EXPO_PUBLIC_ENABLE_* unset (the MVP scope) and
        # snapshots the unauthenticated/onboarding screens. `full` flips every
        # flag on so the feature-gated authenticated screens resolve to their
        # real implementations and can be snapshotted at all (onboarding.test.ts
        # would only ever see the *Disabled stubs otherwise).
        variant: [mvp, full]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install applesimutils
        run: brew tap wix/brew && brew install applesimutils

      - name: Install JS dependencies
        run: |
          npm ci --legacy-peer-deps --ignore-scripts
          npx patch-package
          npm run postinstall

      - name: Build Detox framework cache
        run: npx detox build-framework-cache

      - name: Provision testnet env
        run: cp .env.testnet .env

      - name: Enable all feature flags (full variant only)
        if: matrix.variant == 'full'
        run: |
          for f in BIOMETRIC BUY_SELL DEEPLINKS DFX_BACKEND HARDWARE_WALLET \
                   LEGAL LINKED_WALLETS MULTISIG PASSKEY PAY PIN PORTFOLIO \
                   RESTORE SETTINGS TAX_REPORT TX_HISTORY WEBVIEW; do
            echo "EXPO_PUBLIC_ENABLE_${f}=true" >> .env
          done

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build app for simulator (Release)
        run: npm run e2e:build:ios

      - name: Run visual regression tests
        # MVP build snapshots the onboarding/unauthenticated screens; the full
        # build snapshots the feature-gated authenticated screens. Each leg runs
        # only its own suite so a build never runs the other variant's screens
        # (which would render *Disabled stubs / real screens out of scope).
        run: |
          if [ "${{ matrix.variant }}" = "full" ]; then
            npm run e2e:test:ios -- e2e/visual/authenticated.test.ts
          else
            npm run e2e:test:ios -- e2e/visual/onboarding.test.ts
          fi

      - name: Upload diff images on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-diffs-${{ matrix.variant }}
          path: e2e/__diffs__/
          if-no-files-found: ignore

      - name: Upload Detox artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: detox-artifacts-${{ matrix.variant }}
          path: artifacts/
          if-no-files-found: ignore
