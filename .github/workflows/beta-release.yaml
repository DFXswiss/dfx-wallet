name: Beta Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "" --draft

  build-android:
    name: Build Android
    needs: [create-release]
    if: ${{ always() && !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android
        run: |
          BUILD_JSON=$(eas build --platform android --profile production --non-interactive --wait --json 2>/dev/null)
          echo "$BUILD_JSON" > /tmp/android-build.json
          APK_URL=$(echo "$BUILD_JSON" | jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl // empty')
          echo "APK_URL=$APK_URL" >> $GITHUB_ENV
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ -z "$APK_URL" ]; then
            echo "APK_URL is empty for tag ref; failing closed." >&2
            exit 1
          fi

      - name: Download APK
        if: env.APK_URL != ''
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          VERSION="${TAG#v}"
          curl -fsSL "$APK_URL" -o "dfx-wallet-${VERSION}.apk"

      - name: Upload APK to GitHub Release
        if: env.APK_URL != '' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "" --draft \
            || gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          gh release upload "$GITHUB_REF_NAME" dfx-wallet-*.apk --clobber --repo "$GITHUB_REPOSITORY"

  build-ios:
    name: Build iOS
    needs: [create-release]
    if: ${{ always() && !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS
        run: |
          BUILD_JSON=$(eas build --platform ios --profile production --non-interactive --wait --json 2>/dev/null)
          echo "$BUILD_JSON" > /tmp/ios-build.json
          IPA_URL=$(echo "$BUILD_JSON" | jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl // empty')
          echo "IPA_URL=$IPA_URL" >> $GITHUB_ENV
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ -z "$IPA_URL" ]; then
            echo "IPA_URL is empty for tag ref; failing closed." >&2
            exit 1
          fi

      - name: Download IPA
        if: env.IPA_URL != ''
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          VERSION="${TAG#v}"
          curl -fsSL "$IPA_URL" -o "dfx-wallet-${VERSION}.ipa"

      - name: Upload IPA to GitHub Release
        if: env.IPA_URL != '' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "" --draft \
            || gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          gh release upload "$GITHUB_REF_NAME" dfx-wallet-*.ipa --clobber --repo "$GITHUB_REPOSITORY"

  github-release:
    name: Publish GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6.2.3
        with:
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "categories": [
                {
                  "title": "## 🚀 Features",
                  "labels": ["feat", "feature"]
                },
                {
                  "title": "## 🐛 Fixes",
                  "labels": ["fix", "bug"]
                },
                {
                  "title": "## 📦 Refactor",
                  "labels": ["refactor"]
                },
                {
                  "title": "## 📦 Others",
                  "labels": ["chore"]
                },
                {
                  "title": "## 🌀 Not labelled",
                  "labels": []
                }
              ],
              "label_extractor": [
                {
                  "method": "match",
                  "pattern": "^([\\w\\-]+)",
                  "target": "$1",
                  "on_property": "title"
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets)
          has_apk=$(printf '%s' "$assets" | jq '[.assets[].name] | any(test("\\.apk$"))')
          has_ipa=$(printf '%s' "$assets" | jq '[.assets[].name] | any(test("\\.ipa$"))')
          if [ "$has_apk" != "true" ] || [ "$has_ipa" != "true" ]; then
            echo "Release is missing apk and/or ipa assets; refusing to publish." >&2
            exit 1
          fi
          printf '%s' "$CHANGELOG" > /tmp/release-notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/release-notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
