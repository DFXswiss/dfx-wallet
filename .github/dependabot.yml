version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Zurich
    target-branch: develop
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: expo
        update-types: ['version-update:semver-major']
      - dependency-name: expo-*
        update-types: ['version-update:semver-major']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major']
      - dependency-name: react-native
        update-types: ['version-update:semver-major']
      - dependency-name: react-native-*
        update-types: ['version-update:semver-major']
      - dependency-name: eslint-config-expo
        update-types: ['version-update:semver-major']
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
    labels:
      - dependencies
    # `prefix` already carries the conventional-commit scope, so `include: scope`
    # must stay off — together they produce a double scope ("chore(deps)(deps): …")
    # that fails the pr-policy conventional-commit gate.
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Zurich
    target-branch: develop
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    # See note above: `prefix` carries the scope; `include: scope` would double it.
    commit-message:
      prefix: chore(ci)
