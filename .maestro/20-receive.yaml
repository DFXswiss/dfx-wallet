appId: ${APP_ID}
name: 20-receive
tags:
  - smoke
  - dashboard
  - mvp
---
# Walks an MVP user from a fresh install to the one-screen Receive flow.
# BTC, its chain selector and the QR card are present without an
# intermediate asset-list step.
# With EXPO_PUBLIC_ENABLE_PIN + EXPO_PUBLIC_ENABLE_LEGAL off,
# SetupPinDisabled bridges Create -> Dashboard without a PIN or legal
# step (see 10-onboarding-create.yaml for the same bridge).
- launchApp:
    clearState: true
    clearKeychain: true
# Belt-and-suspenders for the Android emulator: in case the
# Pixel-Launcher disable in the workflow does not take effect (e.g.
# on a future AVD without launcher3 as fallback), dismiss any ANR
# dialog that still overlays the app. 'optional: true' makes this a
# no-op on iOS and when the dialog does not appear.
- tapOn:
    text: "Wait"
    optional: true

# Cold boot warms the WDK worklet; wait for the first screen instead of
# asserting against the short default timeout (avoids a flaky boot race).
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 30000
- tapOn:
    id: "welcome-create-wallet-button"

- assertVisible:
    id: "create-wallet-screen"
- tapOn:
    id: "create-wallet-reveal-button"
- assertVisible:
    id: "create-wallet-seed-container"
- tapOn:
    id: "create-wallet-continue-button"

# Dashboard -> Receive (BTC is selected by default)
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 30000
- tapOn:
    id: "dashboard-action-receive"

- assertVisible:
    id: "receive-screen"
- assertVisible:
    id: "receive-asset-btc"
- assertVisible:
    id: "receive-asset-chf"
- assertVisible:
    id: "receive-chain-bar"
- scrollUntilVisible:
    element:
      id: "receive-qr"
    direction: DOWN
- assertVisible:
    id: "receive-qr"
- scrollUntilVisible:
    element:
      id: "receive-address"
    direction: DOWN
- assertVisible:
    id: "receive-address"
- scrollUntilVisible:
    element:
      id: "receive-share-button"
    direction: DOWN
- assertVisible:
    id: "receive-share-button"
- assertVisible:
    id: "receive-copy-button"
