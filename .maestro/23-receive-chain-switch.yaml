appId: ${APP_ID}
name: 23-receive-chain-switch
tags:
  - smoke
  - dashboard
  - mvp
---
# Tests the chain selector on the Receive screen. BTC ships with two
# layers in the MVP build (DFX_BACKEND off): Bitcoin (chain=bitcoin) and
# Ethereum (chain=ethereum); the Taproot + Lightning layers only appear with
# DFX_BACKEND on. Stablecoin assets (CHF/EUR/USD) keep a locked Ethereum
# segment visible so switching assets does not shift the layout.
- launchApp:
    clearState: true
    clearKeychain: true
# Belt-and-suspenders for the Android emulator: in case the
# Pixel-Launcher disable in the workflow does not take effect (e.g.
# on a future AVD without launcher3 as fallback), dismiss any ANR
# dialog that still overlays the app. 'optional: true' makes this a
# no-op on iOS and when the dialog does not appear.
- tapOn:
    text: "Wait"
    optional: true

# Cold boot warms the WDK worklet; wait for the first screen instead of
# asserting against the short default timeout (avoids a flaky boot race).
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 30000
- tapOn:
    id: "welcome-create-wallet-button"

- assertVisible:
    id: "create-wallet-screen"
- tapOn:
    id: "create-wallet-reveal-button"
- assertVisible:
    id: "create-wallet-seed-container"
- tapOn:
    id: "create-wallet-continue-button"

# Dashboard -> Receive; BTC and its chain selector are already active
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 30000
- tapOn:
    id: "dashboard-action-receive"
- assertVisible:
    id: "receive-screen"
- assertVisible:
    id: "receive-chain-bar"
- assertVisible:
    id: "receive-chain-bitcoin"
- assertVisible:
    id: "receive-chain-ethereum"

# Switch to the EVM layer — the chain chips themselves are stateful;
# we just confirm the chips remain reachable after the tap rather
# than assert a particular address string (WDK may still be deriving
# it in CI).
- tapOn:
    id: "receive-chain-ethereum"
- assertVisible:
    id: "receive-chain-ethereum"

- tapOn:
    id: "receive-chain-bitcoin"
- assertVisible:
    id: "receive-chain-bitcoin"

# Stablecoins update the same screen and retain the locked Ethereum segment
- tapOn:
    id: "receive-asset-chf"
- assertVisible:
    id: "receive-asset-chf"
- assertVisible:
    id: "receive-chain-bar"
- assertVisible:
    id: "receive-chain-ethereum"
