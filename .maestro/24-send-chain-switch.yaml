appId: ${APP_ID}
name: 24-send-chain-switch
tags:
  - smoke
  - dashboard
  - mvp
---
# Tests the chain selector on the Send amount step. An EVM address only
# fits the stablecoins (CHF/EUR/USD), which each have four EVM chains
# (Ethereum, Arbitrum, Polygon, Base); a Bitcoin address only fits BTC,
# which ships with a single chain (spark / Lightning) — the chain bar is
# hidden in that case. A fresh wallet has no balance, so the amount step
# preselects the first stablecoin (CHF).
# Both addresses are placeholders that belong to nobody: the all-zero EVM
# address ending in 1 and the public BIP-173 reference address.
- launchApp:
    clearState: true
    clearKeychain: true
# Belt-and-suspenders for the Android emulator: in case the
# Pixel-Launcher disable in the workflow does not take effect (e.g.
# on a future AVD without launcher3 as fallback), dismiss any ANR
# dialog that still overlays the app. 'optional: true' makes this a
# no-op on iOS and when the dialog does not appear.
- tapOn:
    text: "Wait"
    optional: true

# Cold boot warms the WDK worklet; wait for the first screen instead of
# asserting against the short default timeout (avoids a flaky boot race).
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 30000
- tapOn:
    id: "welcome-create-wallet-button"

- assertVisible:
    id: "create-wallet-screen"
- tapOn:
    id: "create-wallet-reveal-button"
- assertVisible:
    id: "create-wallet-seed-container"
- tapOn:
    id: "create-wallet-continue-button"

# Dashboard -> Send -> EVM address -> amount step with chain selector
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 30000
- tapOn:
    id: "dashboard-action-send"
- assertVisible:
    id: "send-screen"
- tapOn:
    id: "send-recipient-input"
- inputText: "0x0000000000000000000000000000000000000001"
- tapOn:
    id: "send-recipient-continue"

- assertVisible:
    id: "send-amount-step"
- assertVisible:
    id: "send-chain-bar"
- assertVisible:
    id: "send-chain-ethereum"
- assertVisible:
    id: "send-chain-arbitrum"
- assertVisible:
    id: "send-chain-polygon"
- assertVisible:
    id: "send-chain-base"

# Switch between chains — assertion is on chip presence after the tap,
# not the chain-dependent fee estimate (that races against WDK init).
- tapOn:
    id: "send-chain-arbitrum"
- assertVisible:
    id: "send-amount-step"

- tapOn:
    id: "send-chain-polygon"
- assertVisible:
    id: "send-amount-step"

# Bitcoin address has a single chain (spark / Lightning) — chain bar is hidden
- tapOn:
    id: "send-screen-back"
- assertVisible:
    id: "send-overview-step"
- tapOn:
    id: "send-recipient-input"
- eraseText: 60
- inputText: "bc1qar0srrr7xfkvy5l643lydnw9re59gtzzwf5mdq"
- tapOn:
    id: "send-recipient-continue"
- assertVisible:
    id: "send-amount-step"
- assertNotVisible:
    id: "send-chain-bar"
