appId: ${APP_ID}
name: 21-send
tags:
  - smoke
  - dashboard
  - mvp
---
# Walks an MVP user from a fresh install through the Send flow:
# Dashboard -> Send overview ("An wen?", empty address book) -> paste a
# Bitcoin address into the composer -> amount step (keypad, unit bar) ->
# back to the overview. We deliberately stop at the amount step:
#
# - The Confirm step is tested in the component suite
#   (test/components/SendScreen.test.tsx). Maestro's `tapOn: "return"`
#   works on the iOS keyboard but not the Android one, and
#   `hideKeyboard` fails on iOS with "Couldn't hide the keyboard" on the
#   composer, so the flow taps the "continue" row instead of submitting.
# - The actual Confirm tap is intentionally never exercised — it
#   calls handleSend() which broadcasts a real transaction.
# - The address below is the public BIP-173 reference address, not a
#   wallet of ours.
- launchApp:
    clearState: true
    clearKeychain: true
# Belt-and-suspenders for the Android emulator: in case the
# Pixel-Launcher disable in the workflow does not take effect (e.g.
# on a future AVD without launcher3 as fallback), dismiss any ANR
# dialog that still overlays the app. 'optional: true' makes this a
# no-op on iOS and when the dialog does not appear.
- tapOn:
    text: "Wait"
    optional: true

# Cold boot warms the WDK worklet; wait for the first screen instead of
# asserting against the short default timeout (avoids a flaky boot race).
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 30000
- tapOn:
    id: "welcome-create-wallet-button"

- assertVisible:
    id: "create-wallet-screen"
- tapOn:
    id: "create-wallet-reveal-button"
- assertVisible:
    id: "create-wallet-seed-container"
- tapOn:
    id: "create-wallet-continue-button"

# Dashboard -> Send overview (empty address book on a fresh install)
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 30000
- tapOn:
    id: "dashboard-action-send"

- assertVisible:
    id: "send-screen"
- assertVisible:
    id: "send-overview-step"
- assertVisible:
    id: "send-recipient-input"
- assertVisible:
    id: "send-code-card"
- assertVisible:
    id: "send-contacts-empty"
- assertVisible:
    id: "send-account-dfx"

# Composer -> amount step
- tapOn:
    id: "send-recipient-input"
- inputText: "bc1qar0srrr7xfkvy5l643lydnw9re59gtzzwf5mdq"
- assertVisible:
    id: "send-recipient-continue"
- tapOn:
    id: "send-recipient-continue"

- assertVisible:
    id: "send-amount-step"
- assertVisible:
    id: "send-unit-BTC"
- assertVisible:
    id: "amount-key-1"
- assertVisible:
    id: "send-continue-button"
- tapOn:
    id: "amount-key-1"
- assertVisible:
    id: "send-amount-value"

# Back to the overview via the header back button
- tapOn:
    id: "send-screen-back"
- assertVisible:
    id: "send-overview-step"
